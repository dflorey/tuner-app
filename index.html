      background: conic-gradient(from 200deg, #6d6d68, #f2f2ee, #8b8b86, #e0e0db, #6d6d68, #cfcfca, #6d6d68);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.7),
        0 3px 5px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }
    .led {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 55%, #163a1d, #08190c 75%);
      box-shadow:
        0 0 0 2px #121211,
        inset 0 2px 4px rgba(0, 0, 0, 0.8);

    .led::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 5px;
      width: 9px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%);
    }
    .led.on {
      background: radial-gradient(circle at 50% 55%, #e6ffe6 0%, #45f06a 35%, #0f9c2c 80%);
      box-shadow:
        0 0 0 2px #121211,
        0 0 16px 6px rgba(50, 230, 90, 0.5),
        0 0 40px 10px rgba(50, 230, 90, 0.2);

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;

    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;

    .key::before {

      position: absolute;
      inset: 5px 5px 9px;
      border-radius: 3px;

      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);

        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -3px 0 rgba(0, 0, 0, 0.16),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 2px 3px rgba(0, 0, 0, 0.6);

      position: absolute;
      top: 9px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #6e2016, #360b06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.35),
        0 1px 0 1.5px rgba(255, 255, 255, 0.35);
      z-index: 1;
    }
    .key .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #ffb39f, #ff3a1c 55%, #c01a06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(255, 58, 28, 0.6);

    .start {
      width: 96px;
    }
    .start-label {
      color: #e0533d;
    }

    /* Tuning selector */
    .modes {
      display: grid;
      grid-template-columns: repeat(${A.length}, minmax(0, 1fr));
      gap: 0.6rem 1.2rem;
      justify-items: center;
      padding: 1.4rem 2.4rem 1.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .modes .title {
      grid-column: 1 / -1;
      justify-self: start;
    }
    .mode {
      justify-self: stretch;
      height: 60px;
    }
    .icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .icon .fill {
      fill: currentColor;
    }
    .caption {
      margin-top: -0.3rem;
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    @media (max-width: 720px) {
      .cheek {
        flex-basis: 12px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        padding: 0.9rem 1.6rem 0.75rem;
      }
      .meter-section {
        --note-size: 3.4rem;
        --led-size: 8px;
        --freq-size: 1.05rem;
        --string-gap: 0.5rem;
        padding: 1.25rem 1rem 0;
      }
      /*
       * Reference display gets its own row; below it the on/off key is centred, with the input
       * knob and meter to its left and the LED to its right.
       */
      .controls {
        --panel-height: 80px;
        --knob-size: 60px;
        --digit-size: 3rem;
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: var(--panel-height) auto var(--panel-height) auto;
        gap: 0.6rem 0.75rem;
        padding: 1.25rem 1rem;
      }
      .controls value-display {
        grid-area: 1 / 1 / 2 / -1;
      }
      .controls .ref-label {
        grid-area: 2 / 1 / 3 / -1;
      }
      .controls .input-cell {
        grid-area: 3 / 1;
        gap: 0.3rem;
      }
      .controls .start {
        grid-area: 3 / 2;
      }
      .controls .led-cell {
        grid-area: 3 / 3;
      }
      .controls .input-label {
        grid-area: 4 / 1;
      }
      .controls .start-label {
        grid-area: 4 / 2;
      }
      .controls .active-label {
        grid-area: 4 / 3;
      }
      .start {
        width: 84px;
      }
      .label {
        white-space: normal;
      }
      .modes {
        gap: 0.5rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .mode {
        height: 52px;
      }
      .icon {
        width: 36px;
        height: 36px;
      }
      /* Keyboard hints are no use on touch screens; keep the strip for the screws. */
      footer {
        padding: 0;
        height: 30px;
      }
      .hints {
        display: none;
      }
    }
