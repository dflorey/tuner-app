<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tuner FS-2: a vintage-style chromatic tuner for guitar, bass and violin that listens through your microphone." />
    <meta name="theme-color" content="#24211d" />
    <title>Tuner FS-2</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tuner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Phones in portrait and short screens (phones held sideways): every pixel of height counts. */
      @media (max-width: 720px) and (orientation: portrait) {
        body {
          padding-top: max(12px, env(safe-area-inset-top));
          padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      @media (max-height: 520px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /*
       * Installed as an app there is no host page behind it, so give it a dark backdrop. The tuner
       * scales itself to fit the window, so the page never needs to scroll: no scrollbars at all.
       */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
          overflow: hidden;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      tuner-app:not(:defined) {
        display: none;
      }
    </style>

    }
    /*
     * The displays' frames are drawn up to 5px outside their boxes, the keys' outline 2px; stretch
     * the keys 3px past their row so their outer edges line up with the displays.
     */
    .controls .start,
    .controls .fork {
      align-self: stretch;
      margin-block: -3px;
    }
    .start-label {
      color: #e0533d;
    }

    /* Tuning selector */
    .modes {
      display: grid;
      grid-template-columns: repeat(${S.length}, minmax(0, 1fr));
      gap: 0.6rem 1.2rem;
      justify-items: center;
      padding: 1.4rem 2.4rem 1.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .modes .title {
      grid-column: 1 / -1;
      justify-self: start;
    }
    .mode {
      justify-self: stretch;
      height: 60px;
    }
    .icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .icon .fill {
      fill: currentColor;
    }
    .caption {
      margin-top: -0.3rem;
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    /*
     * Tip button between the name and the badge: a key like the others, but with a cap of brushed
     * aluminium, so it looks machined from the strip it sits in; the cup and lettering are etched
     * like the logo.
     */
    .tip-button {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.45rem;
      /* As tall as the badge */
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      padding: 0 0.85rem 0 0.7rem;
      box-sizing: border-box;
      white-space: nowrap;
      font-family: var(--label-font, 'Helvetica Neue', Helvetica, Arial, sans-serif);
      font-size: 0.62rem;
      font-style: normal;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background:
        var(--brushed),
        linear-gradient(180deg, #f6f6f1 0%%, #d6d6d0 48%%, #c0c0ba 52%%, #b2b2ac 100%%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 3px 4px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.05s,
        box-shadow 0.05s,
        filter 0.15s;
    }
    .tip-button:hover {
      filter: brightness(1.06);
    }
    .tip-button:active {
      transform: translateY(1.5px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .tip-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .tip-icon {
      flex: none;
      width: 1.5em;
      height: 1.5em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /* Narrow screens: no room in the strip, so the tip moves to the line under the device */
    @media (max-width: ${lt-1}px) {
      .tip-button {
        display: none;
      }
    }
    @media (min-width: ${lt}px) {
      .tip {
        display: none;
      }
    }
    /*
     * Tip line under the device. The page behind it may be light or dark, so it uses a mid-tone
     * that reads on both.
     */
    .tip {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      color: #8c8577;
    }
    /* Where the full sentence would wrap, fitTip() switches to just the link. */
    .tip-short,
    .tip.short .tip-long {
      display: none;
    }
    .tip.short .tip-short {
      display: inline;
    }
    .tip a {
      color: #e0533d;
      font-weight: 700;
      text-decoration: none;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .tip a:hover {
      text-decoration: underline;
    }
    .tip a:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    /*
     * Below the width where the single row fits, and in the half-width controls panel of the
     * landscape layout: two rows on four columns. On/off key, input knob (free to use the tone
     * key's column) and tuning LED on top; the reference display under the first two, with the tone
     * key and volume knob to its right, the LED centred over the knob.
     */
    @media (max-width: 900px), (orientation: landscape) and (max-height: 520px) {
      .controls {
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        grid-template-rows: var(--panel-height) auto var(--panel-height) auto;
      }
      .controls .start {
        grid-area: 1 / 1;
      }
      /* Knob, meter and their label centred in the space between the on/off key and the LED */
      .controls .input-cell,
      .controls .input-label {
        justify-self: center;
      }
      .controls .input-cell {
        grid-area: 1 / 2 / 2 / 4;
      }
      .controls .led-cell {
        grid-area: 1 / 4;
      }
      .controls .start-label {
        grid-area: 2 / 1;
      }
      .controls .input-label {
        grid-area: 2 / 2 / 3 / 4;
      }
      .controls .led-label {
        grid-area: 2 / 4;
      }
      .controls value-display {
        grid-area: 3 / 1 / 4 / 3;
      }
      .controls .fork {
        grid-area: 3 / 3;
      }
      .controls .volume {
        grid-area: 3 / 4;
      }
      .controls .ref-label {
        grid-area: 4 / 1 / 5 / 3;
      }
      .controls .tone-label {
        grid-area: 4 / 3;
      }
      .controls .volume-label {
        grid-area: 4 / 4;
      }
    }

    @media (max-width: 720px), (orientation: landscape) and (max-height: 520px) {
      :host {
        --start-width: 72px;
      }
      .cheek {
        flex-basis: 12px;
      }
      header {
        padding: 0.9rem 2.2rem 0.75rem 1.6rem;
      }
      .meter-section {
        --note-size: 3.4rem;
        --freq-size: 1.05rem;
        --string-gap: 0.5rem;
        padding: 1.25rem 1rem 0;
      }
      .led-cell .bezel {
        width: 44px;
        height: 44px;
      }
      .led-cell .led {
        width: 28px;
        height: 28px;
      }
      .led-cell .led::after {
        top: 4px;
        left: 6px;
        width: 10px;
        height: 7px;
      }
      /* Compact controls; the digits shrink with the screen so the display row always fits. */
      .controls {
        --panel-height: 72px;
        --knob-size: 60px;
        --input-gap: 0.3rem;
        --digit-size: clamp(1.8rem, 7.5vw, 3rem);
        gap: 0.6rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .controls .volume {
        --knob-size: 56px;
      }
      /* Narrower knob and gap: tighter letter spacing keeps "Input +24 dB" within the label. */
      .label.input-label {
        letter-spacing: 0.1em;
      }
      .fork {
        width: 64px;
      }
      .fork-icon {
        bottom: 9px;
        width: 34px;
        height: 34px;
        margin-left: -17px;
      }
      .ref-label .dim {
        display: none;
      }
      .label {
        white-space: normal;
      }
      .modes {
        gap: 0.5rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .mode {
        height: 52px;
      }
      .icon {
        width: 36px;
        height: 36px;
      }
      /* Keyboard hints are no use on touch screens; keep the strip for the screws. */
      footer {
        padding: 0;
        height: 30px;
      }
      .hints {
        display: none;
      }
    }

    /* Small phones: the note, string names and frequency readout shrink with the screen. */
    @media (max-width: 440px) {
      .meter-section {
        --note-size: clamp(2.4rem, 10vw, 3.4rem);
        --freq-size: clamp(0.62rem, 2.7vw, 1.05rem);
        --string-gap: clamp(0.15rem, 1vw, 0.5rem);
      }
    }

    /*
     * Narrower than today's phones: the reference display gets a row of its own, with the tone key
     * and volume knob below it, and the tuning mode captions don't run together.
     */
    @media (max-width: 359px) {
      .controls {
        grid-template-rows: repeat(3, var(--panel-height) auto);
      }
      .controls value-display {
        grid-area: 3 / 1 / 4 / 5;
      }
      .controls .ref-label {
        grid-area: 4 / 1 / 5 / 5;
      }
      .controls .fork {
        grid-area: 5 / 3;
      }
      .controls .volume {
        grid-area: 5 / 4;
      }
      .controls .tone-label {
        grid-area: 6 / 3;
      }
      .controls .volume-label {
        grid-area: 6 / 4;
      }
      .caption {
        letter-spacing: 0.06em;
      }
    }

    /*
     * Phones in portrait: slimmer header, padding, tuning mode keys and footer, so the stacked
     * panels fit a phone screen at full width rather than being scaled down.
     */
    @media (max-width: 720px) and (orientation: portrait) {
      header {
        padding: 0.6rem 2.2rem 0.5rem 1.6rem;
      }
      .controls {
        padding: 1rem;
      }
      .modes {
        gap: 0.4rem 0.6rem;
        padding: 0.8rem 1rem 0.9rem;
      }
      .mode {
        height: 44px;
      }
      .icon {
        width: 28px;
        height: 28px;
      }
      footer {
        height: 20px;
      }
      .tip {
        margin-top: 0.5rem;
      }
    }

    /*
     * Landscape on phones (and other short screens): the display panel and the controls panel
     * side by side under the name strip, so the device spans the full width instead of shrinking
     * to fit the height. The display is centred vertically in its half; a groove divides the two.
     * Everything is sized down so the whole device fits a phone's landscape height.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      :host {
        --start-width: 64px;
      }
      .panels {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .display-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 1px solid rgba(0, 0, 0, 0.65);
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      header {
        padding: 0.4rem 2.2rem 0.35rem 1.6rem;
      }
      header {
        --brand-size: 1.25rem;
      }
      .meter-section {
        --note-size: 2.6rem;
        --freq-size: 0.95rem;
        /*
         * 15px more on the left: the display's frame then sits as far from the panel's left edge
         * as from the keys on its right (right padding, divider and the controls' padding, less
         * the frame and the key outline).
         */
        padding: 0.8rem 0.8rem 0.8rem calc(0.8rem + 15px);
      }
      .controls {
        --panel-height: 58px;
        --knob-size: 50px;
        row-gap: 0.35rem;
        /*
         * Top padding: the display's frame (aligned with the on/off key) as far below the metal
         * strip as it is from the panel's left edge and from the keys on its right.
         */
        padding: calc(0.8rem + 15px) 1rem 0.5rem;
      }
      /* As much space under the top row's labels as between "Ref. A4" and "Tuning mode". */
      .start-label,
      .input-label,
      .led-label {
        padding-bottom: 1rem;
      }
      .controls .volume {
        --knob-size: 46px;
      }
      .fork {
        width: 56px;
      }
      .fork-icon {
        bottom: 7px;
        width: 28px;
        height: 28px;
        margin-left: -14px;
      }
      .led-cell .bezel {
        width: 40px;
        height: 40px;
      }
      .led-cell .led {
        width: 26px;
        height: 26px;
      }
      /*
       * Tuning mode keys in one row: keys and captions, no instrument icons. The keys' height
       * balances the space above the Hz row, so that row stays centred on the main display.
       */
      .modes {
        gap: 0.3rem 0.5rem;
        padding: 0.5rem 1rem 0.6rem;
      }
      .mode {
        height: 50px;
      }
      .mode .key-led {
        top: 6px;
      }
      .icon {
        display: none;
      }
      .caption {
        margin-top: 0;
      }
      footer {
        height: 16px;
      }
      .tip {
        margin-top: 0.35rem;
      }
    }
